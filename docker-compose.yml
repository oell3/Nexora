# die Rautezeichen dieses Blocks entfernen, den api-Service auf das Netzwerk
# "nexora" umstellen, oben depends_on wieder aktivieren und in der
# Stack-Umgebung DB_HOST=db setzen. Zum Einspielen eines Dumps (*.sql/*.sh)
# liegt der Init-Ordner unter ./db/init (wird beim ersten Start ausgefuehrt).
