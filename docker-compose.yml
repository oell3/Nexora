networks:
  # Netzwerk des vorhandenen Postgres-Containers.
  dbnet:
    external: true
    name: postgresql_default

  # Externes CRM-Netzwerk fuer weitere CRM-Dienste.
  crmnet:
    external: true
    name: crm-network

  # Wird nur fuer den auskommentierten eigenen db-Service gebraucht.
  nexora:
    driver: bridge