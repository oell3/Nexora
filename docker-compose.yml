# Konfiguration: siehe .env.example (dokumentiert alle Variablen)
#
# Diese Datei ist der einzige Stack des Projekts und liegt im Repository-Root.
# Portainer (Repository-Methode): Compose path = docker-compose.yml
#
# Portainer: Es wird bewusst KEIN "env_file" verwendet. Die Werte in "${...}"
# loest Compose aus der Stack-Umgebung auf. In Portainer werden sie im
# Stack-Dialog unter "Environment variables" gesetzt (oder der Inhalt der
# .env per "Load variables from .env file" eingefuegt) und liegen damit in
# der Portainer-Datenbank - die Datei .env muss NICHT im Repository oder auf
# dem Server liegen.
name: nexora

services:
  api:
    build:
      context: ./Nexora
      dockerfile: Dockerfile
    image: nexora-api:latest
    container_name: nexora-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Listenport IM CONTAINER (Kestrel / Server:Port). Der Host-Port wird
      # separat ueber API_HOST_PORT gesetzt (siehe Portmapping unten).
      Server__Port: "${SERVER_PORT:-8089}"
      # Freigegebene Frontend-Origins, mehrere mit ";" trennen (Cors:AllowedOrigins).
      Cors__AllowedOrigins: "${CORS_ALLOWED_ORIGINS:-http://localhost:4200}"
      # Datenbank (Database:*). DB_HOST auf einen externen Host zeigen lassen
      # (z. B. host.docker.internal), um die vorhandene Postgres-Instanz zu nutzen.
      Database__Host: "${DB_HOST:-db}"
      Database__Port: "${DB_PORT:-5432}"
      Database__Username: "${DB_USER:-nexora}"
      Database__Password: "${DB_PASSWORD:?DB_PASSWORD muss in der .env gesetzt sein}"
      Database__Database: "${DB_NAME:-angebotstool}"
      # JWT (Jwt:*). Das Secret wird zum Signieren der Access-Tokens benoetigt.
      Jwt__Issuer: "${JWT_ISSUER:-Nexora}"
      Jwt__Audience: "${JWT_AUDIENCE:-Nexora}"
      Jwt__Secret: "${JWT_SECRET:?JWT_SECRET muss in der .env gesetzt sein}"
      TZ: "${TZ:-Europe/Berlin}"
    ports:
      # Host-Port (links) und Container-Port (rechts) sind bewusst getrennt:
      #   API_HOST_PORT = Port am Docker-Host, SERVER_PORT = Port im Container.
      # Meldet Docker "port is already allocated", hier API_HOST_PORT aendern.
      - "${API_HOST_PORT:-8089}:${SERVER_PORT:-8089}"
    networks:
      - nexora

  db:
    image: postgres:17-alpine
    container_name: nexora-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${DB_USER:-nexora}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD muss in der .env gesetzt sein}"
      POSTGRES_DB: "${DB_NAME:-angebotstool}"
      TZ: "${TZ:-Europe/Berlin}"
    volumes:
      - nexora-db-data:/var/lib/postgresql/data
      # *.sql/*.sh hier ablegen - wird beim ersten Start eingespielt (z. B. pg_dump).
      # Portainer: relativer Pfad, wird im Portainer-Datenverzeichnis erwartet
      # (/data/compose/<stack-id>/db/init). Fuer einen eigenen Pfad absolut angeben.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Nur lokal erreichbar, z. B. fuer pgAdmin. Host-Port 5433, damit der
      # bereits laufende lokale Postgres auf 5432 nicht kollidiert.
      - "127.0.0.1:${DB_EXPOSED_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - nexora

volumes:
  nexora-db-data:

networks:
  nexora:
    driver: bridge